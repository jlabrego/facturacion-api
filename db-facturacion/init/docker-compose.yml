services:
  db_facturacion:
    image: mysql:8.0
    container_name: facturacion_unah
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_facturacion
      MYSQL_USER: unah
      MYSQL_PASSWORD: unah2026

    ports:
      - "3308:3306"

    volumes:
      - db_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d

    command: --default-authentication-plugin=mysql_native_password

volumes:
  db_data: